# Render blueprint for Abandoned Silence.
# The service `name` below is what becomes the public URL:
#   https://abandoned-silence.onrender.com
# Keep the name exactly `abandoned-silence` — changing it changes the URL.
services:
  - type: web
    name: abandoned-silence
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    # Render injects $PORT (default 10000); the app must bind 0.0.0.0.
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
