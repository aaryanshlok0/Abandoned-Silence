# Render blueprint for Abandoned Silence.
# The service `name` below is what becomes the public URL:
#   https://abandoned-silence.onrender.com
# Keep the name exactly `abandoned-silence` — changing it changes the URL.
services:
  - type: web
    name: abandoned-silence
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # Use the committed lockfile so Render installs the exact tested dependency graph.
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run build
    # Render injects $PORT (default 10000); the app must bind 0.0.0.0.
    startCommand: corepack pnpm exec next start -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        # Node 22.11 cannot require the ESM-only magic-string version used by Tailwind 4.
        value: 24.16.0
